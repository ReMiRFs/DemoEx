name: Check template
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: demoex_ci
          MYSQL_USER: demoex_ci
          MYSQL_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: demoex_ci
      DB_USER: demoex_ci
      DB_PASSWORD: ci-only-password
      ADMIN_LOGIN: admin01
      ADMIN_PASSWORD: ci-admin-password
      ADMIN_NAME: Администратор
      API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start test API
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/demoex-api" .
          "$RUNNER_TEMP/demoex-api" migrate
          "$RUNNER_TEMP/demoex-api" seed-admin
          "$RUNNER_TEMP/demoex-api" > "$RUNNER_TEMP/demoex-api.log" 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/api/health
      - run: node tests/api-smoke.mjs
      - name: API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/demoex-api.log" || true

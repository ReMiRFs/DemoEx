<section class="auth-layout" aria-labelledby="login-title">
  <div class="intro">
    <p class="eyebrow">Личный кабинет</p>
    <h1 id="login-title">Продолжим<br>планировать.</h1>
    <p class="lead">Ваши заявки, ближайшие встречи и отзывы — в одном личном кабинете.</p>
    <div class="intro-note"><span aria-hidden="true">→</span><p>Выберите пространство.<br>Остальное — дело встречи.</p></div>
  </div>
  <div class="panel">
    <h2>Вход в аккаунт</h2>
    <p class="muted">Введите данные, указанные при регистрации.</p>
    <form #form="ngForm" (ngSubmit)="submit(form)" novalidate>
      <div class="field">
        <label for="login-login">Логин</label>
        <input id="login-login" name="login" [(ngModel)]="login" required autocomplete="username" data-testid="login-login">
      </div>
      <div class="field">
        <label for="login-password">Пароль</label>
        <input id="login-password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" data-testid="login-password">
      </div>
      @if (error) { <p class="notice error" role="alert">{{ error }}</p> }
      <button class="button button-primary button-wide" type="submit" [disabled]="busy" data-testid="login-submit">{{ busy ? 'Входим…' : 'Войти' }}</button>
    </form>
    <p class="form-footer"><a routerLink="/register">Еще не зарегистрированы? Регистрация</a></p>
  </div>
</section>
